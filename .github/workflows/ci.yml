name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests
      - name: Python compiles
        run: python -m py_compile tools/*.py
      - name: Bash syntax
        run: for f in wsl/*.sh hooks/*.sh; do bash -n "$f"; done
      - name: PowerShell parses
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $t = $null; $e = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($err in $e) { $failed++; Write-Host "::error file=$($f.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)" }
          }
          if ($failed) { exit 1 }
      - name: Example config is valid JSON
        run: python -c "import json; json.load(open('config/forge.example.json'))"
